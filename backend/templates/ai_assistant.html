<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Career Assistant — Get personalized advice on career paths, skills, resumes, and interview preparation.">
  <title>AI Career Assistant — Career DNA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/features.css">
  <script src="/config.js"></script>
  <style>
    .assistant-hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .assistant-hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-dark, #2d1552);
      margin-bottom: 8px;
    }
    .assistant-hero p {
      font-size: 1.05rem;
      color: var(--text-soft, #6b5b95);
      max-width: 640px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .assistant-card {
      max-width: 850px;
      margin: 0 auto 40px auto;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(131, 70, 223, 0.18);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(95, 51, 156, 0.12);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .assistant-card-header {
      background: linear-gradient(135deg, var(--lilac-700, #733bc2), var(--lilac-600, #8346df));
      color: #ffffff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .assistant-card-header h3 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
    }
    .assistant-messages-area {
      min-height: 360px;
      max-height: 520px;
      height: 440px;
      overflow-y: auto;
      background: #faf7ff;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-bubble {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.98rem;
      line-height: 1.55;
      word-wrap: break-word;
      animation: fadeIn 0.25s ease-in-out;
    }
    .chat-bubble.bot {
      align-self: flex-start;
      background: #ffffff;
      color: var(--text-dark, #2d1552);
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(131, 70, 223, 0.15);
      box-shadow: 0 4px 12px rgba(131, 70, 223, 0.06);
    }
    .chat-bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--lilac-600, #8346df), var(--lilac-700, #733bc2));
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(131, 70, 223, 0.2);
    }
    .suggestion-section {
      align-self: flex-start;
      max-width: 100%;
      margin-top: 4px;
    }
    .suggestion-chip {
      background: rgba(131, 70, 223, 0.08);
      color: #6b21a8;
      border: 1px solid rgba(131, 70, 223, 0.2);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .suggestion-chip:hover {
      background: var(--lilac-600, #8346df);
      color: #ffffff;
      border-color: var(--lilac-600, #8346df);
      transform: translateY(-1px);
    }
    .assistant-input-area {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: #ffffff;
      border-top: 1px solid rgba(131, 70, 223, 0.12);
    }
    .assistant-input-area input {
      flex: 1;
      padding: 14px 18px;
      border: 1.5px solid rgba(131, 70, 223, 0.2);
      border-radius: 12px;
      font-size: 0.98rem;
      outline: none;
      background: #faf7ff;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .assistant-input-area input:focus {
      border-color: var(--lilac-600, #8346df);
      box-shadow: 0 0 0 3px rgba(131, 70, 223, 0.15);
      background: #ffffff;
    }
    .assistant-input-area button {
      background: linear-gradient(135deg, var(--lilac-600, #8346df), var(--lilac-700, #733bc2));
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .assistant-input-area button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 640px) {
      .assistant-messages-area {
        height: 380px;
        padding: 16px;
      }
      .chat-bubble {
        max-width: 90%;
      }
      .assistant-input-area {
        padding: 12px 14px;
        gap: 8px;
      }
      .assistant-input-area button {
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper page-shell">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="dashboard-container" style="max-width: 1280px; margin: 0 auto; position: relative; z-index: 1;">
      
      <!-- Navbar -->
      <header class="navbar" style="margin-bottom: 30px;">
        <div class="nav-left">
          <a href="/welcome" class="nav-btn secondary-btn" style="text-decoration:none; display: inline-flex; align-items: center; gap: 8px;">
            ← Back to Dashboard
          </a>
        </div>
        <h2 style="margin: 0; font-size: 1.5rem; font-weight: 700; color: var(--text-dark, #2d1552);">AI Career Assistant</h2>
      </header>

      <!-- Welcome Title & Intro -->
      <div class="assistant-hero">
        <h1>AI Career Assistant</h1>
        <p>Hi! I'm your Career Assistant. Ask me anything about careers, skills, interviews, learning, resumes, or career planning.</p>
      </div>

      <!-- Chat Container -->
      <div class="assistant-card">
        
        <div class="assistant-card-header">
          <h3>🤖 Career Assistant</h3>
          <span style="font-size: 0.85rem; background: rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 20px; font-weight: 500;">
            Online
          </span>
        </div>

        <div id="chatMessages" class="assistant-messages-area">
          
          <div class="chat-bubble bot">
            Hello! I'm your Career Assistant. How can I help you today?
          </div>

          <div class="suggestion-section">
            <p style="font-size: 0.85rem; font-weight: 600; color: #6b5b95; margin: 0 0 10px 4px; display: flex; align-items: center; gap: 6px;">
              💡 Suggested questions:
            </p>
            <div class="suggestions-grid" style="display: flex; flex-wrap: wrap; gap: 8px;">
              <button class="suggestion-chip" onclick="selectSuggestion('What career is right for me?')">What career is right for me?</button>
              <button class="suggestion-chip" onclick="selectSuggestion('What skills should I learn?')">What skills should I learn?</button>
              <button class="suggestion-chip" onclick="selectSuggestion('How can I improve my resume?')">How can I improve my resume?</button>
              <button class="suggestion-chip" onclick="selectSuggestion('How should I prepare for an interview?')">How should I prepare for an interview?</button>
              <button class="suggestion-chip" onclick="selectSuggestion('What certification should I take?')">What certification should I take?</button>
            </div>
          </div>

        </div>

        <div class="assistant-input-area">
          <input type="text" id="chatInput" placeholder="Ask your career question..." autocomplete="off" />
          <button id="chatSend">
            <span>Send</span> <i class="fas fa-paper-plane" style="font-size: 0.9rem;"></i>
          </button>
        </div>

      </div>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const chatMessages = document.getElementById("chatMessages");
      const chatInput = document.getElementById("chatInput");
      const chatSend = document.getElementById("chatSend");

      function selectSuggestion(text) {
        if (!text) return;
        chatInput.value = text;
        sendMessage();
      }
      window.selectSuggestion = selectSuggestion;

      function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        // Display User Message
        const userDiv = document.createElement("div");
        userDiv.className = "chat-bubble user";
        userDiv.textContent = text;
        chatMessages.appendChild(userDiv);
        chatInput.value = "";
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Display Loading Message
        const botDiv = document.createElement("div");
        botDiv.className = "chat-bubble bot";
        botDiv.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i> Thinking...';
        chatMessages.appendChild(botDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Call Backend Endpoint
        const apiBase = window.CAREER_DNA_API_BASE || '';
        const endpoint = apiBase ? (apiBase.endsWith('/') ? apiBase.slice(0, -1) : apiBase) + '/api/chat' : '/api/chat';

        fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: 'include',
          body: JSON.stringify({ message: text })
        })
        .then(res => {
          if (!res.ok) {
            throw new Error('Server returned error status ' + res.status);
          }
          return res.json();
        })
        .then(data => {
          if (data && data.reply) {
            botDiv.innerHTML = data.reply;
          } else {
            botDiv.textContent = "I'm here to help with your career questions. What else would you like to know?";
          }
          chatMessages.scrollTop = chatMessages.scrollHeight;
        })
        .catch(err => {
          console.error("Career Assistant connection error:", err);
          botDiv.textContent = "Unable to connect to the Career Assistant right now. Please try again.";
          chatMessages.scrollTop = chatMessages.scrollHeight;
        });
      }

      chatSend.addEventListener("click", sendMessage);
      chatInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          sendMessage();
        }
      });
    });
  </script>
</body>
</html>
