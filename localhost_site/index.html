<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Localhost Demo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, hsl(210, 60%, 45%), hsl(260, 60%, 45%));
    }
    .card {
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 2rem 3rem;
      text-align: center;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 2.5rem;
    }
    p {
      margin: 0;
      font-size: 1.2rem;
    }
    a {
      color: #fffa;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to Localhost</h1>
    <p>This premium page is served from <code>http://localhost:8000</code></p>
    <p>Enjoy the modern glassmorphism design!</p>
    <p><a href="https://github.com" target="_blank">Learn more.</a></p>
  </div>
</body>
</html>
