<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore top industry-recognized certifications matched to your target career path on Career DNA.">
  <title>Recommended Certifications — Career DNA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/features.css">
  <style>
    .cert-hero {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      padding: 32px;
      border: 1px solid rgba(131, 70, 223, 0.12);
      box-shadow: var(--shadow-soft);
      margin-bottom: 36px;
      backdrop-filter: blur(18px);
    }
    .filter-pills-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    .filter-btn {
      padding: 8px 18px;
      border-radius: 99px;
      border: 1px solid rgba(131, 70, 223, 0.2);
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--lilac-600);
      color: #ffffff;
      border-color: var(--lilac-600);
    }
    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .cert-card-rich {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 22px;
      padding: 26px;
      border: 1px solid rgba(131, 70, 223, 0.12);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .cert-card-rich:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(95, 51, 156, 0.15);
    }
    .cert-badge-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .cert-provider-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--lilac-700);
      background: var(--lilac-100);
      padding: 4px 10px;
      border-radius: 99px;
    }
    .cert-diff-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .diff-beg { background: rgba(16, 185, 129, 0.15); color: #059669; }
    .diff-int { background: rgba(79, 172, 254, 0.15); color: #0284c7; }
    .diff-adv { background: rgba(245, 158, 11, 0.15); color: #d97706; }
    .cert-title-rich {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .cert-why-box {
      background: rgba(247, 242, 255, 0.7);
      border-radius: 12px;
      padding: 12px;
      margin: 14px 0;
      font-size: 0.88rem;
      color: var(--text-soft);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper page-shell">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="dashboard-container" style="max-width: 1280px; margin: 0 auto; position: relative; z-index: 1;">

      <!-- Navbar -->
      <header class="navbar" style="margin-bottom: 36px;">
        <div class="nav-left">
          <a href="/welcome" class="logo-wrap" style="text-decoration: none;">
            <div class="logo-badge career-logo"><div class="logo-circle"></div><div class="logo-arrow arrow-1"></div><div class="logo-arrow arrow-2"></div><div class="logo-arrow arrow-3"></div></div>
            <div class="logo-text"><span class="logo-main">Career</span><span class="logo-accent">DNA</span></div>
          </a>
        </div>
        <nav class="nav-links">
          <a href="/welcome">Dashboard</a>
          <a href="/assessment" class="nav-take-test-link">Take Test</a>
          <a href="/career-paths">Career Paths</a>
          <a href="/resources">Resources</a>
          <a href="/history">History</a>
          <a href="/profile">Profile</a>
        </nav>
        <div class="nav-actions">
          <a href="/welcome" class="nav-btn secondary-btn" style="text-decoration:none;">← Dashboard</a>
        </div>
      </header>

      <!-- Hero Banner -->
      <section class="cert-hero">
        <h1 class="section-header" style="font-size: 2.2rem; margin-bottom: 8px;">Recommended Certifications</h1>
        <p style="color: var(--text-soft); font-size: 1.05rem; max-width: 760px; line-height: 1.6;">
          Industry-recognized certifications curated to boost your resume ATS match score and accelerate your hiring trajectory.
        </p>

        <!-- Category Filters -->
        <div class="filter-pills-wrap" id="categoryFilters">
          <button class="filter-btn active" onclick="filterCerts('All', this)">All Categories</button>
          <button class="filter-btn" onclick="filterCerts('Cloud & DevOps', this)">Cloud & DevOps</button>
          <button class="filter-btn" onclick="filterCerts('Data & AI', this)">Data & AI</button>
          <button class="filter-btn" onclick="filterCerts('Software Engineering', this)">Software Engineering</button>
          <button class="filter-btn" onclick="filterCerts('Cybersecurity', this)">Cybersecurity</button>
        </div>
      </section>

      <!-- Certifications Cards Grid -->
      <section class="cert-grid" id="certsGrid">
        <!-- Rendered dynamically -->
      </section>

    </div>
  </div>

  <script>
    const certsData = [
      {
        title: 'Google Data Analytics Professional Certificate',
        provider: 'Google (Coursera)',
        category: 'Data & AI',
        difficulty: 'Beginner',
        diffClass: 'diff-beg',
        duration: '3-6 Months',
        why: 'High market demand for data-driven roles. Covers SQL, R, Data Cleaning, and Tableau visualization.',
        link: 'https://www.coursera.org/professional-certificates/google-data-analytics'
      },
      {
        title: 'AWS Certified Solutions Architect – Associate',
        provider: 'Amazon Web Services',
        category: 'Cloud & DevOps',
        difficulty: 'Intermediate',
        diffClass: 'diff-int',
        duration: '2-3 Months',
        why: 'Industry gold standard credential for cloud deployment, microservices architecture, and security policies.',
        link: 'https://aws.amazon.com/certification/certified-solutions-architect-associate/'
      },
      {
        title: 'Microsoft Certified: Azure AI Engineer Associate',
        provider: 'Microsoft',
        category: 'Data & AI',
        difficulty: 'Intermediate',
        diffClass: 'diff-int',
        duration: '2-4 Months',
        why: 'Specialized credential for building cognitive computer vision, NLP, and enterprise LLM solutions.',
        link: 'https://learn.microsoft.com/en-us/credentials/certifications/azure-ai-engineer/'
      },
      {
        title: 'Meta Front-End Developer Professional Certificate',
        provider: 'Meta (Coursera)',
        category: 'Software Engineering',
        difficulty: 'Beginner',
        diffClass: 'diff-beg',
        duration: '4-6 Months',
        why: 'Comprehensive React, HTML5/CSS3, JavaScript, and responsive UI engineering credential.',
        link: 'https://www.coursera.org/professional-certificates/meta-front-end-developer'
      },
      {
        title: 'CompTIA Security+ Certification',
        provider: 'CompTIA',
        category: 'Cybersecurity',
        difficulty: 'Intermediate',
        diffClass: 'diff-int',
        duration: '3 Months',
        why: 'Baseline cybersecurity credential required by enterprise tech firms and cloud infrastructure teams.',
        link: 'https://www.comptia.org/certifications/security'
      },
      {
        title: 'IBM Data Science Professional Certificate',
        provider: 'IBM (Coursera)',
        category: 'Data & AI',
        difficulty: 'Intermediate',
        diffClass: 'diff-int',
        duration: '4-5 Months',
        why: 'Deep dive into Python data science libraries (Pandas, Scikit-learn) and predictive machine learning models.',
        link: 'https://www.coursera.org/professional-certificates/ibm-data-science'
      }
    ];

    function renderCerts(filter = 'All') {
      const grid = document.getElementById('certsGrid');
      grid.innerHTML = '';

      const filtered = filter === 'All' ? certsData : certsData.filter(c => c.category === filter);

      filtered.forEach(c => {
        const card = document.createElement('div');
        card.className = 'cert-card-rich';
        card.innerHTML = `
          <div>
            <div class="cert-badge-top">
              <span class="cert-provider-tag"><i class="fas fa-award" style="margin-right: 4px;"></i>${c.provider}</span>
              <span class="cert-diff-tag ${c.diffClass}">${c.difficulty}</span>
            </div>
            <h3 class="cert-title-rich">${c.title}</h3>
            <div style="font-size: 0.85rem; color: var(--text-soft); font-weight: 600; margin-bottom: 6px;">
              <i class="fas fa-clock" style="margin-right: 4px;"></i>Est. Duration: ${c.duration}
            </div>
            <div class="cert-why-box">
              <strong style="color: var(--text-dark);">Why Recommended:</strong> ${c.why}
            </div>
          </div>
          <div style="margin-top: auto; padding-top: 12px;">
            <a href="${c.link}" target="_blank" rel="noopener noreferrer" class="nav-btn primary-btn" style="width: 100%; text-decoration: none; text-align: center; display: inline-block;">
              View Certification ↗
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCerts(category, btnElem) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnElem.classList.add('active');
      renderCerts(category);
    }

    window.addEventListener('DOMContentLoaded', () => renderCerts('All'));
  </script>
</body>
</html>
