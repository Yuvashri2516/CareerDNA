<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certifications - Career DNA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/features.css') }}">
</head>
<body>
<div class="dashboard-wrapper">
  <div class="dashboard-container">
    <section class="dashboard-section">
      <h2 class="section-header">Recommended Certifications</h2>
      <div class="cert-card-grid">
        <div class="cert-card">
          <div class="cert-provider">Google</div>
          <div class="cert-name">Data Analytics Professional</div>
          <div class="cert-meta"><span>Beginner</span> <span>6 Months</span></div>
        </div>
        <div class="cert-card">
          <div class="cert-provider">Microsoft</div>
          <div class="cert-name">Azure AI Engineer Associate</div>
          <div class="cert-meta"><span>Intermediate</span> <span>3-4 Months</span></div>
        </div>
        <div class="cert-card">
          <div class="cert-provider">AWS</div>
          <div class="cert-name">Certified Solutions Architect</div>
          <div class="cert-meta"><span>Intermediate</span> <span>4-5 Months</span></div>
        </div>
        <!-- Add more certification cards as needed -->
      </div>
    </section>
  </div>
</div>
</body>
</html>
