<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Career Assistant - Career DNA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/features.css') }}">
</head>
<body>
<div class="dashboard-wrapper">
  <div class="dashboard-container">
    <header class="navbar" style="margin-bottom: 40px;">
      <div class="nav-left">
        <a href="/welcome" class="nav-btn secondary-btn" style="text-decoration:none;">← Back to Dashboard</a>
      </div>
      <h2>AI Career Assistant</h2>
    </header>
    <section class="dashboard-section">
      <div class="chatbot-container" style="max-width:800px;margin:auto;">
        <div class="chatbot-header" style="background: var(--lilac-500); color:#fff; padding:12px; border-radius:12px 12px 0 0;">
          <h3>💬 AI Career Assistant</h3>
        </div>
        <div class="chatbot-messages" id="chatMessages" style="height:400px;overflow-y:auto;background:#faf7ff;padding:12px;border:1px solid rgba(131,70,223,0.15);border-top:none;">
          <div class="chat-msg bot">Hello! I am your AI Career Assistant. Ask me about roadmaps, resumes, interview tips, or any career query.</div>
        </div>
        <div class="chatbot-input-area" style="display:flex;border-top:1px solid rgba(131,70,223,0.15);">
          <input type="text" id="chatInput" placeholder="Type your question..." style="flex:1;padding:12px;border:none;outline:none;"/>
          <button id="chatSend" style="background:var(--lilac-500);color:#fff;border:none;padding:12px;cursor:pointer;">Send</button>
        </div>
      </div>
    </section>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  function send(){
    const text = chatInput.value.trim();
    if(!text) return;
    const userDiv = document.createElement('div');
    userDiv.className='chat-msg user';
    userDiv.textContent = text;
    chatMessages.appendChild(userDiv);
    chatInput.value='';
    const botDiv = document.createElement('div');
    botDiv.className='chat-msg bot';
    botDiv.textContent='Assistant is thinking...';
    chatMessages.appendChild(botDiv);
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})})
      .then(r=>r.json())
      .then(d=>{botDiv.innerHTML = d.reply;})
      .catch(()=>{botDiv.textContent='Sorry, something went wrong.';});
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
  chatSend.addEventListener('click', send);
  chatInput.addEventListener('keypress', e=>{if(e.key==='Enter') send();});
});
</script>
</body>
</html>
