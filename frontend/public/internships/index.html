<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover curated internships and entry-level career opportunities on Career DNA.">
  <title>Internship Opportunities — Career DNA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/features.css">
  <style>
    .intern-hero {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      padding: 32px;
      border: 1px solid rgba(131, 70, 223, 0.12);
      box-shadow: var(--shadow-soft);
      margin-bottom: 36px;
      backdrop-filter: blur(18px);
    }
    .intern-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .intern-card {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 22px;
      padding: 26px;
      border: 1px solid rgba(131, 70, 223, 0.12);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .intern-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(95, 51, 156, 0.15);
    }
    .intern-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .intern-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.3;
    }
    .curated-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      background: rgba(131, 70, 223, 0.15);
      color: var(--lilac-700);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .intern-company {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--lilac-600);
      margin-bottom: 12px;
    }
    .intern-details-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-soft);
      margin-bottom: 14px;
    }
    .intern-details-row span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 16px;
    }
    .skill-tag-sm {
      background: var(--lilac-100);
      color: var(--lilac-800);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper page-shell">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="dashboard-container" style="max-width: 1280px; margin: 0 auto; position: relative; z-index: 1;">

      <!-- Navbar -->
      <header class="navbar" style="margin-bottom: 36px;">
        <div class="nav-left">
          <a href="/" class="logo-wrap" style="text-decoration: none;">
            <div class="logo-badge career-logo"><div class="logo-circle"></div><div class="logo-arrow arrow-1"></div><div class="logo-arrow arrow-2"></div><div class="logo-arrow arrow-3"></div></div>
            <div class="logo-text"><span class="logo-main">Career</span><span class="logo-accent">DNA</span></div>
          </a>
        </div>
        <nav class="nav-links">
          <a href="/">Home</a>
          <a href="/career-paths">Career Paths</a>
          <a href="/resources">Resources</a>
          <a href="/contact">Contact</a>
        </nav>
        <div class="nav-actions">
          <a href="/login" class="nav-btn secondary-btn" style="text-decoration:none;">Log In</a>
        </div>
      </header>

      <!-- Hero & Search Filters -->
      <section class="intern-hero">
        <h1 class="section-header" style="font-size: 2.2rem; margin-bottom: 8px;">Internship Discovery</h1>
        <p style="color: var(--text-soft); font-size: 1.05rem; max-width: 760px; line-height: 1.6; margin-bottom: 24px;">
          Explore curated entry-level internships and practical work opportunities matching your skill profile.
        </p>

        <div style="display: flex; gap: 16px; flex-wrap: wrap;">
          <input type="text" id="internSearch" class="search-input" style="flex: 1; min-width: 260px;" placeholder="Search internships by role, company, or skills..." oninput="filterInternships()">
          <select id="workTypeFilter" class="search-input" style="width: auto; min-width: 160px; border-radius: 99px;" onchange="filterInternships()">
            <option value="All">All Work Types</option>
            <option value="Remote">Remote</option>
            <option value="Hybrid">Hybrid</option>
            <option value="On-site">On-site</option>
          </select>
        </div>
      </section>

      <!-- Internship Cards Grid -->
      <section class="intern-grid" id="internGrid">
        <!-- Rendered dynamically -->
      </section>

    </div>
  </div>

  <!-- Application Detail Modal -->
  <div id="internModal" style="display: none; position: fixed; inset: 0; background: rgba(36,19,63,0.5); backdrop-filter: blur(4px); z-index: 999; justify-content: center; align-items: center; padding: 20px;">
    <div class="glass-card" style="max-width: 520px; width: 100%; background: #ffffff; padding: 28px; border-radius: 24px;">
      <h3 id="modalRoleTitle" style="color: var(--text-dark); font-size: 1.3rem; margin-bottom: 4px;">Role Title</h3>
      <div id="modalCompany" style="color: var(--lilac-600); font-weight: 700; margin-bottom: 16px;">Company</div>
      
      <div style="background: rgba(247, 242, 255, 0.8); border-radius: 14px; padding: 16px; margin-bottom: 16px; font-size: 0.9rem; color: var(--text-soft); line-height: 1.5;">
        <strong style="color: var(--text-dark);">Eligibility & Requirements:</strong>
        <div id="modalElig" style="margin-top: 4px;"></div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-dark); margin-bottom: 6px;">Quick Cover Letter Note (Optional)</label>
        <textarea class="form-input" rows="3" placeholder="I am excited to apply for this role because my background in Python and REST APIs matches your stack..."></textarea>
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end;">
        <button class="nav-btn secondary-btn" onclick="document.getElementById('internModal').style.display='none'">Close</button>
        <button class="nav-btn primary-btn" onclick="submitAppSimulator()">Submit Application</button>
      </div>
    </div>
  </div>

  <script>
    const internshipList = [
      {
        id: 1,
        role: 'Software Engineering Intern',
        company: 'TechCorp Labs',
        location: 'Remote',
        workType: 'Remote',
        duration: '6 Months',
        stipend: '$28 - $35 / hr',
        eligibility: 'Final Year Undergrads or Recent Graduates in CS / IT / STEM fields.',
        skills: ['Python', 'REST APIs', 'SQL', 'Git']
      },
      {
        id: 2,
        role: 'Data Science & Analytics Intern',
        company: 'Insightful Analytics',
        location: 'New York, NY',
        workType: 'Hybrid',
        duration: '3 Months',
        stipend: '$25 - $30 / hr',
        eligibility: 'Students or bootcamp grads with strong Python, SQL, and data visualization projects.',
        skills: ['Python', 'Pandas', 'SQL', 'Tableau']
      },
      {
        id: 3,
        role: 'Frontend Developer Intern',
        company: 'Pixel Craft Studios',
        location: 'Remote',
        workType: 'Remote',
        duration: '4 Months',
        stipend: '$22 - $28 / hr',
        eligibility: 'Self-taught or degree developers proficient in HTML5/CSS3, JavaScript (ES6+), and React.',
        skills: ['JavaScript', 'HTML/CSS', 'Vite', 'React']
      },
      {
        id: 4,
        role: 'Cloud & DevOps Operations Intern',
        company: 'CloudScale Systems',
        location: 'Austin, TX',
        workType: 'Hybrid',
        duration: '6 Months',
        stipend: '$26 - $32 / hr',
        eligibility: 'Undergrads with interest in AWS cloud deployment, Linux administration, and Docker.',
        skills: ['AWS', 'Linux', 'Docker', 'Python']
      },
      {
        id: 5,
        role: 'AI & Machine Learning Intern',
        company: 'MindAI Research',
        location: 'Remote',
        workType: 'Remote',
        duration: '6 Months',
        stipend: '$30 - $40 / hr',
        eligibility: 'Graduate or senior undergraduate students with coursework in ML, PyTorch, and NLP.',
        skills: ['Python', 'PyTorch', 'NLP', 'Machine Learning']
      },
      {
        id: 6,
        role: 'Product Analyst Intern',
        company: 'NextGen Ventures',
        location: 'San Francisco, CA',
        workType: 'On-site',
        duration: '3 Months',
        stipend: '$24 - $30 / hr',
        eligibility: 'Open to all majors with analytical problem-solving and user research passion.',
        skills: ['Data Analysis', 'SQL', 'User Research', 'Agile']
      }
    ];

    function renderInternships(data) {
      const grid = document.getElementById('internGrid');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-soft);">No matching internship opportunities found.</div>`;
        return;
      }

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'intern-card';
        card.innerHTML = `
          <div>
            <div class="intern-header">
              <h3 class="intern-title">${item.role}</h3>
              <span class="curated-badge">Curated Opportunity</span>
            </div>
            <div class="intern-company"><i class="fas fa-building" style="margin-right:4px;"></i>${item.company}</div>
            <div class="intern-details-row">
              <span><i class="fas fa-map-marker-alt" style="color:var(--lilac-600);"></i> ${item.location} (${item.workType})</span>
              <span><i class="fas fa-clock" style="color:var(--lilac-600);"></i> ${item.duration}</span>
              <span><i class="fas fa-dollar-sign" style="color:#059669;"></i> ${item.stipend}</span>
            </div>
            <div class="tag-container">
              ${item.skills.map(s => `<span class="skill-tag-sm">${s}</span>`).join('')}
            </div>
          </div>
          <div style="margin-top: auto; padding-top: 14px;">
            <button class="nav-btn primary-btn" style="width: 100%; justify-content: center;" onclick="openAppModal(${item.id})">
              Apply / View Details
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterInternships() {
      const query = document.getElementById('internSearch').value.toLowerCase();
      const workType = document.getElementById('workTypeFilter').value;

      const filtered = internshipList.filter(item => {
        const matchesQuery = item.role.toLowerCase().includes(query) ||
                             item.company.toLowerCase().includes(query) ||
                             item.skills.some(s => s.toLowerCase().includes(query));
        const matchesType = workType === 'All' || item.workType === workType;
        return matchesQuery && matchesType;
      });

      renderInternships(filtered);
    }

    function openAppModal(id) {
      const item = internshipList.find(i => i.id === id);
      if (!item) return;
      document.getElementById('modalRoleTitle').innerText = item.role;
      document.getElementById('modalCompany').innerText = `${item.company} • ${item.location}`;
      document.getElementById('modalElig').innerText = item.eligibility;
      document.getElementById('internModal').style.display = 'flex';
    }

    function submitAppSimulator() {
      alert('Application submitted successfully! Your profile has been forwarded for review.');
      document.getElementById('internModal').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', () => renderInternships(internshipList));
  </script>
</body>
</html>
