<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Step-by-step personalized learning roadmap tailored for your target career path on Career DNA.">
  <title>Learning Roadmap — Career DNA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/features.css">
  <script src="/config.js"></script>
  <style>
    .roadmap-hero {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      padding: 32px;
      border: 1px solid rgba(131, 70, 223, 0.12);
      box-shadow: var(--shadow-soft);
      margin-bottom: 36px;
      backdrop-filter: blur(18px);
    }
    .timeline-wrapper {
      position: relative;
      padding-left: 30px;
      margin-top: 20px;
    }
    .timeline-wrapper::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 20px;
      bottom: 20px;
      width: 4px;
      background: linear-gradient(180deg, var(--lilac-600) 0%, rgba(131,70,223,0.15) 100%);
      border-radius: 4px;
    }
    .timeline-step {
      position: relative;
      margin-bottom: 36px;
    }
    .timeline-node {
      position: absolute;
      left: -30px;
      top: 24px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--lilac-600);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--lilac-700);
      box-shadow: 0 4px 12px rgba(131,70,223,0.2);
      z-index: 2;
    }
    .timeline-node.completed {
      background: var(--lilac-600);
      color: #ffffff;
      border-color: var(--lilac-600);
    }
    .timeline-node.current {
      background: var(--lilac-100);
      border-color: var(--lilac-600);
      box-shadow: 0 0 0 4px rgba(157, 92, 255, 0.25);
    }
    .step-card {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 20px;
      padding: 28px;
      border: 1px solid rgba(131, 70, 223, 0.12);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      transition: transform 0.25s ease;
    }
    .step-card:hover {
      transform: translateY(-3px);
    }
    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .step-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-dark);
    }
    .status-tag {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-completed { background: rgba(16, 185, 129, 0.15); color: #059669; }
    .status-current { background: rgba(157, 92, 255, 0.18); color: var(--lilac-700); }
    .status-upcoming { background: rgba(107, 114, 128, 0.15); color: #4b5563; }
  </style>
</head>
<body>
  <div class="dashboard-wrapper page-shell">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="dashboard-container" style="max-width: 1240px; margin: 0 auto; position: relative; z-index: 1;">

      <!-- Navbar -->
      <header class="navbar" style="margin-bottom: 36px;">
        <div class="nav-left">
          <a href="/welcome" class="logo-wrap" style="text-decoration: none;">
            <div class="logo-badge career-logo"><div class="logo-circle"></div><div class="logo-arrow arrow-1"></div><div class="logo-arrow arrow-2"></div><div class="logo-arrow arrow-3"></div></div>
            <div class="logo-text"><span class="logo-main">Career</span><span class="logo-accent">DNA</span></div>
          </a>
        </div>
        <nav class="nav-links">
          <a href="/welcome">Dashboard</a>
          <a href="/assessment" class="nav-take-test-link">Take Test</a>
          <a href="/career-paths">Career Paths</a>
          <a href="/resources">Resources</a>
          <a href="/history">History</a>
          <a href="/profile">Profile</a>
        </nav>
        <div class="nav-actions">
          <a href="/welcome" class="nav-btn secondary-btn" style="text-decoration:none;">← Dashboard</a>
        </div>
      </header>

      <!-- Roadmap Header & Summary -->
      <section class="roadmap-hero">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
          <div>
            <h1 class="section-header" style="font-size: 2.2rem; margin-bottom: 8px;">Personalized Learning Roadmap</h1>
            <p style="color: var(--text-soft); font-size: 1.05rem; max-width: 760px; line-height: 1.6;" id="roadmapCareerSubtitle">
              Loading your career roadmap stages...
            </p>
          </div>
          <div style="text-align: right; min-width: 200px;">
            <span style="font-size: 0.85rem; color: var(--text-soft); font-weight: 600;">Overall Progress</span>
            <div style="font-size: 2rem; font-weight: 800; color: var(--lilac-700);" id="overallRoadmapPct">0%</div>
          </div>
        </div>

        <div style="margin-top: 20px; background: rgba(131, 70, 223, 0.1); height: 12px; border-radius: 99px; overflow: hidden;">
          <div id="overallProgressFill" style="width: 0%; height: 100%; background: linear-gradient(90deg, var(--lilac-500), var(--lilac-700)); transition: width 0.5s ease;"></div>
        </div>
      </section>

      <!-- Vertical Roadmap Timeline -->
      <section class="timeline-wrapper" id="roadmapTimeline">
        <div style="text-align: center; padding: 40px; color: var(--text-soft);">
          <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--lilac-600); margin-bottom: 12px;"></i>
          <p>Generating your personalized career roadmap...</p>
        </div>
      </section>

    </div>
  </div>

  <script>
    let activeCareerId = null;
    let currentStagesData = [];

    document.addEventListener("DOMContentLoaded", function() {
      initRoadmap();
    });

    function initRoadmap() {
      const apiBase = window.CAREER_DNA_API_BASE || '';
      const recEndpoint = (apiBase ? (apiBase.endsWith('/') ? apiBase.slice(0, -1) : apiBase) : '') + '/api/career-recommendations';

      fetch(recEndpoint, { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          if (data && data.success && data.ideal_match) {
            activeCareerId = data.ideal_match.career_id;
            const careerName = data.ideal_match.career_name;
            document.getElementById('roadmapCareerSubtitle').innerHTML = `A structured step-by-step career path tailored for <strong style="color: var(--lilac-800);">${careerName}</strong>.`;
            loadCareerRoadmap(activeCareerId);
          } else {
            showEmptyState();
          }
        })
        .catch(err => {
          console.error("Error loading career recommendations:", err);
          showEmptyState();
        });
    }

    function showEmptyState() {
      document.getElementById('roadmapCareerSubtitle').innerText = 'Complete your career profile and assessment to view your personalized roadmap.';
      document.getElementById('roadmapTimeline').innerHTML = `
        <div class="glass-card" style="text-align: center; padding: 48px; border-radius: 24px; background: rgba(255,255,255,0.9);">
          <i class="fas fa-route" style="font-size: 3rem; color: var(--lilac-600); margin-bottom: 16px;"></i>
          <h3 style="color: var(--text-dark); font-size: 1.5rem; margin-bottom: 8px;">No Roadmap Generated Yet</h3>
          <p style="color: var(--text-soft); font-size: 1.05rem; max-width: 500px; margin: 0 auto 24px auto;">
            Complete your profile and career assessment to generate your personalized learning roadmap.
          </p>
          <a href="/assessment" class="nav-btn primary-btn" style="text-decoration:none; display: inline-block;">Take Career Assessment</a>
        </div>
      `;
    }

    function loadCareerRoadmap(careerId) {
      const apiBase = window.CAREER_DNA_API_BASE || '';
      const endpoint = (apiBase ? (apiBase.endsWith('/') ? apiBase.slice(0, -1) : apiBase) : '') + '/api/career/' + careerId + '/roadmap';

      fetch(endpoint, { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          if (data && data.success && data.roadmap) {
            renderRoadmap(data.roadmap);
          } else {
            showEmptyState();
          }
        })
        .catch(err => {
          console.error("Error loading roadmap:", err);
          document.getElementById('roadmapTimeline').innerHTML = `
            <div style="text-align: center; padding: 30px; color: #c62828;">
              <p>Unable to load your roadmap right now. Please try again.</p>
              <button onclick="loadCareerRoadmap('${careerId}')" class="nav-btn secondary-btn" style="margin-top: 10px;">Retry</button>
            </div>
          `;
        });
    }

    function renderRoadmap(roadmapData) {
      const container = document.getElementById('roadmapTimeline');
      container.innerHTML = '';

      const stages = roadmapData.stages || [];
      currentStagesData = stages;

      let completedCount = 0;

      stages.forEach((s) => {
        if (s.status === 'Completed' || s.completed) completedCount++;

        let nodeClass = '';
        let statusTagClass = 'status-upcoming';
        let statusIcon = '<i class="fas fa-clock"></i>';

        if (s.status === 'Completed' || s.completed) {
          nodeClass = 'completed';
          statusTagClass = 'status-completed';
          statusIcon = '<i class="fas fa-check-circle"></i>';
        } else if (s.status === 'Current') {
          nodeClass = 'current';
          statusTagClass = 'status-current';
          statusIcon = '<i class="fas fa-spinner fa-spin"></i>';
        }

        const stepElem = document.createElement('div');
        stepElem.className = 'timeline-step';
        stepElem.innerHTML = `
          <div class="timeline-node ${nodeClass}">${(s.status === 'Completed' || s.completed) ? '✓' : s.stage_number}</div>
          <div class="step-card">
            <div class="step-header">
              <div>
                <span class="status-tag ${statusTagClass}">${statusIcon} ${s.status}</span>
                <h3 class="step-title" style="margin-top: 8px;">${s.title}</h3>
              </div>
              <button class="nav-btn secondary-btn" style="padding: 6px 14px; font-size: 0.85rem;" onclick="toggleStageProgress(${s.stage_number})">
                ${s.status === 'Completed' ? 'Mark Current' : (s.status === 'Current' ? 'Mark Completed' : 'Start Stage')}
              </button>
            </div>

            <p style="color: var(--text-soft); font-size: 0.95rem; line-height: 1.6; margin-top: 8px;">
              ${s.description || 'Focus on building key skills and projects for this stage.'}
            </p>
          </div>
        `;
        container.appendChild(stepElem);
      });

      const totalPct = stages.length > 0 ? Math.round((completedCount / stages.length) * 100) : 0;
      document.getElementById('overallRoadmapPct').innerText = `${totalPct}%`;
      document.getElementById('overallProgressFill').style.width = `${totalPct}%`;
    }

    function toggleStageProgress(stageNum) {
      if (!activeCareerId) return;

      let completedStages = [];
      let nextCurrentStage = stageNum;

      currentStagesData.forEach(s => {
        if (s.stage_number < stageNum) {
          completedStages.push(s.stage_number);
        }
      });

      // If user clicks on current stage button to mark completed:
      const targetStage = currentStagesData.find(s => s.stage_number === stageNum);
      if (targetStage && targetStage.status === 'Current') {
        completedStages.push(stageNum);
        nextCurrentStage = stageNum + 1;
      }

      const apiBase = window.CAREER_DNA_API_BASE || '';
      const endpoint = (apiBase ? (apiBase.endsWith('/') ? apiBase.slice(0, -1) : apiBase) : '') + '/api/roadmap-progress';

      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          career_id: activeCareerId,
          completed_stages: completedStages,
          current_stage: nextCurrentStage
        })
      })
      .then(res => res.json())
      .then(data => {
        loadCareerRoadmap(activeCareerId);
      })
      .catch(err => {
        console.error("Error updating roadmap progress:", err);
      });
    }
  </script>
</body>
</html>
